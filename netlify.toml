# Netlify: builds the game from this repository (npm run build) and serves the dist folder.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Program files have a fingerprint in their name: browsers may keep them for a year (faster start).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
